name: WPS BIFF8 government ET candidate discovery
on:
  pull_request:
    paths:
      - 'tests/wps_biff8_gov_et_discovery.py'
      - '.github/workflows/wps-biff8-gov-et.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  government-et:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: WPS environment precheck
        run: |
          python -I -S -B skills/wps/scripts/read_wps.py --check
      - name: Inspect exact official ET attachments and real CodePage records
        run: |
          python -I -S -B tests/wps_biff8_gov_et_discovery.py
