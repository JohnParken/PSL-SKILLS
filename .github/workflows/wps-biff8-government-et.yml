name: WPS BIFF8 real government ET salvage probe
on:
  pull_request:
    paths:
      - 'tests/wps_biff8_salvage_government_probe.py'
      - 'skills/wps/scripts/wps_biff8.py'
      - 'skills/wps/scripts/wps_biff8_names.py'
      - 'skills/et/scripts/test/test_wps_biff8_print_titles_memfunc.py'
      - '.github/workflows/wps-biff8-government-et.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-et-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: WPS offline environment check
        run: |
          python -I -S -B skills/wps/scripts/read_wps.py --check
      - name: Bounded direct government ET sample comparison
        run: |
          python -I -S -B tests/wps_biff8_salvage_government_probe.py
