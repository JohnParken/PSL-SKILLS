name: WPS BIFF8 real built-in Name discovery
on:
  pull_request:
    paths:
      - 'tests/wps_biff8_builtin_real_source_discovery.py'
      - '.github/workflows/wps-biff8-builtin-real.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-name-attachments:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline Skill environment check
        run: |
          python -I -S -B skills/wps/scripts/read_wps.py --check
      - name: Independent bounded public ET Name record observations
        run: |
          python -I -S -B tests/wps_biff8_builtin_real_source_discovery.py
