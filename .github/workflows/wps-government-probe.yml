name: WPS government attachment provenance probe
on:
  pull_request:
    paths:
      - 'tests/wps_government_attachment_probe.py'
      - '.github/workflows/wps-government-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: WPS Skill environment check
        run: |
          python -I -S -B skills/wps/scripts/read_wps.py --check
      - name: Bounded official attachment download and content-identified read
        run: |
          python -I -S -B tests/wps_government_attachment_probe.py
